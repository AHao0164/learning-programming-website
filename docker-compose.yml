services:
  mongo:
    image: mongo:latest
    container_name: coding_platform_db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./piston/data/piston/packages:/piston/packages
    tmpfs:
      - /tmp:exec

  backend:
    build: ./backend
    container_name: coding_platform_backend
    restart: unless-stopped
    ports:
      - "5005:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-coding-platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PISTON_API_URL=http://piston:2000/api/v2/execute
    depends_on:
      - mongo
      - redis
      - piston
    volumes:
      - ./backend:/app
      - /app/node_modules

  redis:
    image: redis:alpine
    container_name: coding_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build: ./frontend
    container_name: coding_platform_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true 
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist

volumes:
  mongo_data:
  redis_data: